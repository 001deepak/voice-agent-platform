<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voice Agent Platform</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; }
  h1 { font-size: 22px; }
  input { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: #222; color: white; border: none; cursor: pointer; }
  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tabs button { background: #eee; color: #222; }
  .tabs button.active { background: #222; color: white; }
  #message { color: red; margin-top: 10px; }
</style>
</head>
<body>
  <h1>Your AI Voice Agent Platform</h1>
  <div class="tabs">
    <button id="tabSignup" class="active" onclick="showTab('signup')">Sign Up</button>
    <button id="tabLogin" onclick="showTab('login')">Log In</button>
  </div>

  <form id="signupForm">
    <input type="text" id="su_businessName" placeholder="Business name" required />
    <input type="email" id="su_email" placeholder="Email" required />
    <input type="password" id="su_password" placeholder="Password" required />
    <button type="submit">Create account</button>
  </form>

  <form id="loginForm" style="display:none">
    <input type="email" id="li_email" placeholder="Email" required />
    <input type="password" id="li_password" placeholder="Password" required />
    <button type="submit">Log in</button>
  </form>

  <div id="message"></div>

<script>
function showTab(tab) {
  document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
}

async function handleAuthResponse(res) {
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('message').textContent = data.error || 'Something went wrong';
    return;
  }
  localStorage.setItem('token', data.token);
  localStorage.setItem('businessName', data.businessName);
  window.location.href = '/dashboard.html';
}

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/signup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      businessName: document.getElementById('su_businessName').value,
      email: document.getElementById('su_email').value,
      password: document.getElementById('su_password').value,
    }),
  });
  handleAuthResponse(res);
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: document.getElementById('li_email').value,
      password: document.getElementById('li_password').value,
    }),
  });
  handleAuthResponse(res);
});
</script>
</body>
</html>
